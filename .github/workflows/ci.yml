name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Format check
        run: |
          if command -v clang-format >/dev/null 2>&1; then
            clang-format --dry-run --Werror $(find cxxkit src tests -name '*.hpp' -o -name '*.cpp') || exit 1
          fi

      - name: Namespace / identifier checks (C7)
        run: |
          test -d cxxkit || exit 1
          grep -rn "#include <CxxKit" cxxkit/ tests/ examples/ | wc -l | grep -q '^0$' || exit 1
          grep -rnE "octk::|#define OCTK_|octk_config" cxxkit/ tests/ --include="*.cpp" --include="*.hpp" | wc -l | grep -q '^0$' || exit 1

      - name: C++11 strictness gate (C4)
        run: |
          grep -rnE "std::[a-z_]+_t<|if constexpr|\[\][^)]*\(auto|0b[01]'[, ]" cxxkit/ --include="*.hpp" --include="*.cpp" | wc -l | grep -q '^0$' || exit 1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCXXKIT_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: clang-tidy static analysis (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y clang-tidy
          set +e
          clang-tidy -p build -header-filter='cxxkit/' $(find cxxkit -name '*.cpp' -not -path '*3rdparty*') > /tmp/clang-tidy-report.txt 2>&1
          findings=$(grep -cE 'warning:|error:' /tmp/clang-tidy-report.txt)
          echo "clang-tidy findings: ${findings}"
          grep -E 'warning:|error:' /tmp/clang-tidy-report.txt | head -30
          # Warn-only gate: report findings without failing. Tighten to zero once baseline is clean.
          exit 0

      - name: Test
        run: ctest --test-dir build --output-on-failure
